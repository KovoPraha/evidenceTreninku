name: Nastavit Stripe sandbox na produkční doméně

on:
  workflow_dispatch:
    inputs:
      potvrzeni:
        description: 'Pro zapnutí testovacích plateb napište přesně ZAPNOUT-STRIPE-TEST'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  DEPLOY_BASE: data/.kis-deploy
  CONFIG_BACKUP_DIR: data/.kis-backups/config

jobs:
  nastavit:
    name: Stripe sandbox (kis.kovopraha.cz)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Ověřit ruční potvrzení
        env:
          POTVRZENI: ${{ inputs.potvrzeni }}
        run: |
          if [ "$POTVRZENI" != 'ZAPNOUT-STRIPE-TEST' ]; then
            echo '❌ Zapnutí Stripe sandboxu nebylo potvrzeno přesným textem.'
            exit 1
          fi

      - name: Stáhnout konfigurační nástroj
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ověřit SSH a Stripe secrets
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
          STRIPE_SECRET_KEY_VALUE: ${{ secrets.KIS_STRIPE_TEST_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY_VALUE: ${{ secrets.KIS_STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET_VALUE: ${{ secrets.KIS_STRIPE_TEST_WEBHOOK_SECRET }}
        run: |
          for promenna in APP_HOST REMOTE_DIR SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET STRIPE_SECRET_KEY_VALUE STRIPE_PUBLISHABLE_KEY_VALUE STRIPE_WEBHOOK_SECRET_VALUE; do
            if [ -z "${!promenna}" ]; then
              echo "❌ Chybí povinná konfigurace: $promenna."
              exit 1
            fi
          done
          case "$REMOTE_DIR" in
            /*|*..*) echo '❌ KIS_REMOTE_DIR musí být relativní cesta bez ..'; exit 1 ;;
          esac
          [[ "$STRIPE_SECRET_KEY_VALUE" =~ ^sk_test_[A-Za-z0-9_]+$ ]] || { echo '❌ Stripe secret není testovací.'; exit 1; }
          [[ "$STRIPE_PUBLISHABLE_KEY_VALUE" =~ ^pk_test_[A-Za-z0-9_]+$ ]] || { echo '❌ Stripe publishable key není testovací.'; exit 1; }
          [[ "$STRIPE_WEBHOOK_SECRET_VALUE" =~ ^whsec_[A-Za-z0-9_]+$ ]] || { echo '❌ Stripe webhook secret není platný.'; exit 1; }

          PORT="${SSH_PORT_SECRET:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          if [ "$PORT" = '22' ]; then HLEDAT="$SSH_HOST_SECRET"; else HLEDAT="[$SSH_HOST_SECRET]:$PORT"; fi
          ssh-keygen -F "$HLEDAT" -f ~/.ssh/known_hosts > /dev/null

          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"

          php -r '$v=["secret_key"=>getenv("STRIPE_SECRET_KEY_VALUE"),"publishable_key"=>getenv("STRIPE_PUBLISHABLE_KEY_VALUE"),"webhook_secret"=>getenv("STRIPE_WEBHOOK_SECRET_VALUE"),"base_url"=>"https://".getenv("APP_HOST")];file_put_contents("/tmp/stripe-secrets.json",json_encode($v,JSON_THROW_ON_ERROR),LOCK_EX);'
          chmod 600 /tmp/stripe-secrets.json

      - name: Zálohovat a zapnout Stripe sandbox
        run: |
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          SCP=(scp -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          "${SSH[@]}" "set -eu; umask 077; test -d '$REMOTE_DIR'; test -s '$REMOTE_DIR/config.php'; mkdir -p '$DEPLOY_BASE' '$CONFIG_BACKUP_DIR'"
          "${SCP[@]}" bin/configure-production-stripe.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/configure-production-stripe.php"
          "${SCP[@]}" /tmp/stripe-secrets.json "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/stripe-secrets.json"

          cat > /tmp/run-stripe-config.php <<EOF
          <?php
          putenv('CONFIGURE_PRODUCTION_STRIPE=1');
          putenv('STRIPE_CONFIG_ACTION=configure_test');
          putenv('APP_HOST=$APP_HOST');
          putenv('APP_ROOT=$REMOTE_DIR');
          putenv('CONFIG_BACKUP_DIR=$CONFIG_BACKUP_DIR');
          putenv('STRIPE_SECRETS_FILE=$DEPLOY_BASE/stripe-secrets.json');
          require __DIR__ . '/configure-production-stripe.php';
          kisProductionStripeMain();
          EOF
          "${SCP[@]}" /tmp/run-stripe-config.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-stripe-config.php"
          "${SSH[@]}" "php '$DEPLOY_BASE/run-stripe-config.php'" | tee /tmp/configure-result.json
          jq -e '.ok == true and .mode == "test"' /tmp/configure-result.json > /dev/null

          cat > /tmp/run-stripe-probe.php <<EOF
          <?php
          putenv('CONFIGURE_PRODUCTION_STRIPE=1');
          putenv('STRIPE_CONFIG_ACTION=probe');
          putenv('APP_HOST=$APP_HOST');
          putenv('APP_ROOT=$REMOTE_DIR');
          require __DIR__ . '/configure-production-stripe.php';
          kisProductionStripeMain();
          EOF
          "${SCP[@]}" /tmp/run-stripe-probe.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-stripe-probe.php"
          "${SSH[@]}" "php '$DEPLOY_BASE/run-stripe-probe.php'" | tee /tmp/probe-result.json
          jq -e '.ok == true and .environment == "production" and .stripe_enabled == true and .stripe_test_pair == true and .stripe_live_pair == false and .webhook_secret == true and .base_url_ok == true' /tmp/probe-result.json > /dev/null
          echo '✅ Stripe sandbox je na produkční doméně zapnutý; live klíče nejsou přítomné.'

      - name: Uklidit dočasné kopie secrets
        if: always()
        continue-on-error: true
        run: |
          rm -f /tmp/stripe-secrets.json /tmp/run-stripe-config.php /tmp/run-stripe-probe.php
          if [ -n "${SSH_HOST:-}" ] && [ -n "${SSH_PORT:-}" ] && [ -n "${SSH_USER:-}" ]; then
            ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST" \
              "rm -f '$DEPLOY_BASE/stripe-secrets.json' '$DEPLOY_BASE/run-stripe-config.php' '$DEPLOY_BASE/run-stripe-probe.php' '$DEPLOY_BASE/configure-production-stripe.php'"
          fi
