name: Provoz a čtecí posouzení Fio

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Čtecí status/audit nebo instalace samostatného hostingového spouštěče'
        required: true
        type: choice
        options: [status, audit, install]
      potvrzeni:
        description: 'OVERIT-FIO-PROVOZ nebo ZAPNOUT-FIO-HOSTING'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  DEPLOY_BASE: data/.kis-deploy

jobs:
  operations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Připravit ověřené spojení a přesnou operaci
        env:
          ACTION: ${{ inputs.action }}
          POTVRZENI: ${{ inputs.potvrzeni }}
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$APP_HOST" = kis.kovopraha.cz
          [[ "$REMOTE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$REMOTE_DIR" != *..* ]] && [[ "$REMOTE_DIR" != /* ]]
          case "$ACTION" in
            status|audit) test "$POTVRZENI" = OVERIT-FIO-PROVOZ ;;
            install) test "$POTVRZENI" = ZAPNOUT-FIO-HOSTING ;;
            *) exit 64 ;;
          esac
          for key in SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do test -n "${!key}"; done
          PORT="${SSH_PORT_SECRET:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          if [ "$PORT" = 22 ]; then LOOKUP="$SSH_HOST_SECRET"; else LOOKUP="[$SSH_HOST_SECRET]:$PORT"; fi
          ssh-keygen -F "$LOOKUP" -f ~/.ssh/known_hosts >/dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"
      - name: Provést izolovanou operaci bez čtení tokenu do runneru
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          source .github/scripts/production-ssh-retry.sh
          production_ssh_init
          production_retry "${SCP[@]}" bin/fio-production-operations.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/fio-operations-$GITHUB_RUN_ID.php"
          cat > /tmp/run-fio-operations.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('APP_ROOT=$REMOTE_DIR');
          putenv('FIO_HOSTING_OPERATIONS=' . __DIR__);
          putenv('FIO_HOSTING_ACTION=$ACTION');
          putenv('FIO_HOSTING_CONFIRM=ZAPNOUT-FIO-HOSTING');
          require __DIR__ . '/fio-operations-$GITHUB_RUN_ID.php';
          kisFioHostingMain();
          EOF
          production_retry "${SCP[@]}" /tmp/run-fio-operations.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-fio-operations-$GITHUB_RUN_ID.php"
          production_retry "${SSH[@]}" "php '$DEPLOY_BASE/run-fio-operations-$GITHUB_RUN_ID.php'" | tee /tmp/fio-operations-result.json
          jq -e '.ok == true' /tmp/fio-operations-result.json >/dev/null
      - name: Uklidit pouze pomocné soubory tohoto běhu
        if: always()
        continue-on-error: true
        run: |
          rm -f /tmp/run-fio-operations.php /tmp/fio-operations-result.json
          if [ -n "${SSH_HOST:-}" ] && [ -n "${SSH_PORT:-}" ] && [ -n "${SSH_USER:-}" ]; then
            source .github/scripts/production-ssh-retry.sh
            production_ssh_init
            production_retry "${SSH[@]}" "rm -f -- '$DEPLOY_BASE/fio-operations-$GITHUB_RUN_ID.php' '$DEPLOY_BASE/run-fio-operations-$GITHUB_RUN_ID.php'"
          fi
