name: Ověřit produkční Packetu bez objednávky (pouze čtení)

on:
  workflow_dispatch:
    inputs:
      potvrzeni:
        description: 'Pro kontrolu kis.kovopraha.cz napište OVERIT-PACKETU-VYPNUTOU'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  DEPLOY_BASE: data/.kis-deploy

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Ověřit cíl a potvrzení
        env:
          POTVRZENI: ${{ inputs.potvrzeni }}
        run: |
          set -euo pipefail
          test "$POTVRZENI" = 'OVERIT-PACKETU-VYPNUTOU'
          test "$APP_HOST" = 'kis.kovopraha.cz'
          [[ "$REMOTE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$REMOTE_DIR" != *..* ]]

      - name: Stáhnout aktuální commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Připravit ověřené SSH spojení
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do test -n "${!name}"; done
          PORT="${SSH_PORT_SECRET:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          if [ "$PORT" = 22 ]; then LOOKUP="$SSH_HOST_SECRET"; else LOOKUP="[$SSH_HOST_SECRET]:$PORT"; fi
          ssh-keygen -F "$LOOKUP" -f ~/.ssh/known_hosts >/dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"

      - name: Ověřit vypnutí checkoutu a skutečné CZ Z-BOXy bez zápisů
        run: |
          set -euo pipefail
          source .github/scripts/production-ssh-retry.sh
          production_ssh_init
          production_retry "${SCP[@]}" bin/diagnose-production-packeta.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/diagnose-production-packeta.php"
          cat > /tmp/run-packeta-diagnostic.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('KIS_PACKETA_DIAGNOSTIC_ROOT=$REMOTE_DIR');
          putenv('KIS_PACKETA_DIAGNOSTIC_CONFIRM=OVERIT-PACKETU-VYPNUTOU');
          require __DIR__ . '/diagnose-production-packeta.php';
          exit(diagnoseProductionPacketa());
          EOF
          production_retry "${SCP[@]}" /tmp/run-packeta-diagnostic.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-packeta-diagnostic.php"
          "${SSH[@]}" "php '$DEPLOY_BASE/run-packeta-diagnostic.php'" | tee /tmp/kis-packeta.json
          jq -e '.ok == true and .target == "kis.kovopraha.cz" and
            .shipping_enabled == false and .simulation_enabled == false and
            .read_only_session == true and .disabled_checkout_rejected == true and
            .personal_pickup_valid == true and .settings_unchanged == true and
            .live_box.id == "22312" and .enabled_checkout_uat == false' /tmp/kis-packeta.json >/dev/null

      - name: Uklidit dočasné skripty
        if: always()
        continue-on-error: true
        run: |
          rm -f /tmp/kis-packeta.json /tmp/run-packeta-diagnostic.php
          if [ -n "${SSH_HOST:-}" ]; then
            source .github/scripts/production-ssh-retry.sh
            production_ssh_init
            production_retry "${SSH[@]}" "rm -f -- '$DEPLOY_BASE/diagnose-production-packeta.php' '$DEPLOY_BASE/run-packeta-diagnostic.php'"
          fi
