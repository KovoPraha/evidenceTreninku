name: Produkcni provozni drill

on:
  workflow_dispatch:
    inputs:
      operace:
        description: 'Bezpecna provozni operace'
        required: true
        type: choice
        options:
          - obnovit-zalohu-izolovane
          - obnovit-tri-zalohy-izolovane
          - overit-databazove-invarianty
          - deaktivovat-testovaci-ucty
          - vytvorit-kis-test-admina
      potvrzeni:
        description: 'Pro spusteni napiste presne PROVEST'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  DEPLOY_BASE: data/.kis-deploy
  BACKUP_DIR: data/.kis-backups

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Overit potvrzeni a konfiguraci
        run: |
          test '${{ inputs.potvrzeni }}' = 'PROVEST'
          test -n "$APP_HOST"
          test -n "$REMOTE_DIR"

      - name: Stahnout kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Pripravit overene SSH spojeni
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for promenna in SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do
            test -n "${!promenna}"
          done
          PORT="${SSH_PORT_SECRET:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          if [ "$PORT" = '22' ]; then HLEDAT="$SSH_HOST_SECRET"; else HLEDAT="[$SSH_HOST_SECRET]:$PORT"; fi
          ssh-keygen -F "$HLEDAT" -f ~/.ssh/known_hosts > /dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"

      - name: Obnovit vybrane generace zaloh do izolovane MariaDB
        if: inputs.operace == 'obnovit-zalohu-izolovane' || inputs.operace == 'obnovit-tri-zalohy-izolovane'
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          SCP=(scp -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          TMP="/tmp/kis-restore-drill-$GITHUB_RUN_ID"
          install -d -m 700 "$TMP"
          COUNT=1
          if [ '${{ inputs.operace }}' = 'obnovit-tri-zalohy-izolovane' ]; then COUNT=3; fi
          mapfile -t BACKUPS < <("${SSH[@]}" "set -eu; ls -1t '$BACKUP_DIR'/evidence_*.sql.gz 2>/dev/null | head -n '$COUNT'")
          test "${#BACKUPS[@]}" = "$COUNT"

          VERIFIED=0
          for LATEST in "${BACKUPS[@]}"; do
            [[ "$LATEST" =~ ^data/\.kis-backups/evidence_[0-9A-Za-z_-]+\.sql\.gz$ ]]
            BASE="${LATEST%.sql.gz}"
            "${SCP[@]}" "$SSH_USER@$SSH_HOST:$LATEST" "$TMP/"
            "${SCP[@]}" "$SSH_USER@$SSH_HOST:$BASE.sha256" "$TMP/"
            "${SCP[@]}" "$SSH_USER@$SSH_HOST:$BASE.manifest.json" "$TMP/"
            cd "$TMP"
            SQL_FILE=$(basename "$LATEST")
            SHA_FILE="$(basename "$BASE").sha256"
            MANIFEST_FILE="$(basename "$BASE").manifest.json"
            sha256sum -c "$SHA_FILE"
            test "$(jq -r '.sha256' "$MANIFEST_FILE")" = "$(sha256sum "$SQL_FILE" | awk '{print $1}')"
            test "$(jq -r '.application' "$MANIFEST_FILE")" = 'evidence'
            test "$(jq -r '.sql_file' "$MANIFEST_FILE")" = "$SQL_FILE"
            test "$(jq -r '.format_version | numbers' "$MANIFEST_FILE")" -ge 1

            VERIFIED=$((VERIFIED + 1))
            CONTAINER="kis-restore-$GITHUB_RUN_ID-$VERIFIED"
            RESTORE_PASSWORD=$(openssl rand -hex 24)
            docker run -d --name "$CONTAINER" -e MARIADB_ROOT_PASSWORD="$RESTORE_PASSWORD" mariadb:11.4 > /dev/null
            READY=0
            for i in $(seq 1 60); do
              if docker exec "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" -Nse 'SELECT 1' > /dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 2
            done
            test "$READY" = '1'
            docker exec "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" -e 'CREATE DATABASE kis_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
            gzip -dc "$SQL_FILE" | docker exec -i "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" kis_restore

            CHECKED=0
            while IFS=$'\t' read -r TABLE EXPECTED; do
              [[ "$TABLE" =~ ^[a-z0-9_]+$ ]]
              ACTUAL=$(docker exec "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" -Nse "SELECT COUNT(*) FROM \`$TABLE\`" kis_restore)
              test "$ACTUAL" = "$EXPECTED"
              CHECKED=$((CHECKED + 1))
            done < <(jq -r '.tables | to_entries[] | [.key,.value] | @tsv' "$MANIFEST_FILE")
            EXPECTED_TRIGGERS=$(jq -r '.triggers | sort | join("\n")' "$MANIFEST_FILE")
            ACTUAL_TRIGGERS=$(docker exec "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" -Nse "SELECT TRIGGER_NAME FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='kis_restore' ORDER BY TRIGGER_NAME")
            test "$ACTUAL_TRIGGERS" = "$EXPECTED_TRIGGERS"
            docker rm -f "$CONTAINER" > /dev/null
            echo "Generace $VERIFIED obnovena: $CHECKED tabulek, $(jq '.triggers | length' "$MANIFEST_FILE") triggeru."
          done
          echo "Izolovana obnova overena pro $VERIFIED generaci zaloh."

      - name: Overit databazove invarianty pouze ctenim
        if: inputs.operace == 'overit-databazove-invarianty'
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          SCP=(scp -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          "${SCP[@]}" bin/production-invariants.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/production-invariants.php"
          cat > /tmp/run-production-invariants.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('APP_ROOT=$REMOTE_DIR');
          putenv('KIS_INVARIANT_CONFIRM=OVERIT');
          require __DIR__ . '/production-invariants.php';
          EOF
          "${SCP[@]}" /tmp/run-production-invariants.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-production-invariants.php"
          "${SSH[@]}" "php '$DEPLOY_BASE/run-production-invariants.php'"

      - name: Deaktivovat vyhradne jednorazove testovaci ucty
        if: inputs.operace == 'deaktivovat-testovaci-ucty'
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          SCP=(scp -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          "${SCP[@]}" bin/production-test-cleanup.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/production-test-cleanup.php"
          cat > /tmp/run-production-test-cleanup.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('APP_ROOT=$REMOTE_DIR');
          putenv('KIS_TEST_CLEANUP_CONFIRM=DEAKTIVOVAT');
          require __DIR__ . '/production-test-cleanup.php';
          EOF
          "${SCP[@]}" /tmp/run-production-test-cleanup.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-production-test-cleanup.php"
          "${SSH[@]}" "php '$DEPLOY_BASE/run-production-test-cleanup.php'"

      - name: Vytvorit nebo obnovit vyhradne KIS testovaciho administratora
        if: inputs.operace == 'vytvorit-kis-test-admina'
        env:
          KIS_TEST_ADMIN_PASSWORD_VALUE: ${{ secrets.KIS_TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KIS_TEST_ADMIN_PASSWORD_VALUE"
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          SCP=(scp -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          export KIS_TEST_ADMIN_EMAIL_VALUE='kis@velocota.com'
          export KIS_TEST_ADMIN_NAME_VALUE='KIS testovací administrátor'
          php -r '$v=["email"=>getenv("KIS_TEST_ADMIN_EMAIL_VALUE"),"name"=>getenv("KIS_TEST_ADMIN_NAME_VALUE"),"password"=>getenv("KIS_TEST_ADMIN_PASSWORD_VALUE")];file_put_contents("/tmp/kis-test-admin.json",json_encode($v,JSON_THROW_ON_ERROR),LOCK_EX);'
          chmod 600 /tmp/kis-test-admin.json
          "${SCP[@]}" bin/provision-production-test-admin.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/provision-production-test-admin.php"
          "${SCP[@]}" /tmp/kis-test-admin.json "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/kis-test-admin.json"
          cat > /tmp/run-provision-production-test-admin.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('APP_ROOT=$REMOTE_DIR');
          putenv('KIS_TEST_ADMIN_CONFIRM=VYTVORIT-KIS-ADMINA');
          putenv('KIS_TEST_ADMIN_SETTINGS_FILE=$DEPLOY_BASE/kis-test-admin.json');
          require __DIR__ . '/provision-production-test-admin.php';
          kisProductionTestAdminMain();
          EOF
          "${SCP[@]}" /tmp/run-provision-production-test-admin.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-provision-production-test-admin.php"
          "${SSH[@]}" "php '$DEPLOY_BASE/run-provision-production-test-admin.php'" | tee /tmp/kis-test-admin-result.json
          jq -e '.ok == true and .email == "kis@velocota.com" and .role == "admin" and .active == true and .password_verified == true' /tmp/kis-test-admin-result.json > /dev/null
          echo 'KIS testovaci administrator byl vytvoren a overen.'

      - name: Uklid docasnych dat drillu
        if: always()
        continue-on-error: true
        run: |
          docker ps -aq --filter "name=kis-restore-$GITHUB_RUN_ID" | xargs -r docker rm -f > /dev/null 2>&1 || true
          TMP="/tmp/kis-restore-drill-$GITHUB_RUN_ID"
          if [ -d "$TMP" ] && [[ "$TMP" =~ ^/tmp/kis-restore-drill-[0-9]+$ ]]; then
            find "$TMP" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir "$TMP"
          fi
          rm -f /tmp/kis-test-admin.json /tmp/kis-test-admin-result.json /tmp/run-provision-production-test-admin.php
          if [ -n "${SSH_HOST:-}" ]; then
            ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST" "rm -f -- '$DEPLOY_BASE/production-test-cleanup.php' '$DEPLOY_BASE/run-production-test-cleanup.php' '$DEPLOY_BASE/production-invariants.php' '$DEPLOY_BASE/run-production-invariants.php' '$DEPLOY_BASE/kis-test-admin.json' '$DEPLOY_BASE/provision-production-test-admin.php' '$DEPLOY_BASE/run-provision-production-test-admin.php'" || true
          fi
