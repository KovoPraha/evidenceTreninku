name: Pracovní upozornění – provoz

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Kontrola, instalace minutového zpracování nebo zpracování upozornění'
        required: true
        type: choice
        options: [status, install, process]
      potvrzeni:
        description: 'OVERIT-UPOZORNENI nebo ZAPNOUT-UPOZORNENI'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  DEPLOY_BASE: data/.kis-deploy

jobs:
  operations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Připravit ověřené spojení a přesnou operaci
        env:
          ACTION: ${{ inputs.action }}
          POTVRZENI: ${{ inputs.potvrzeni }}
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$APP_HOST" = kis.kovopraha.cz
          [[ "$REMOTE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$REMOTE_DIR" != *..* ]] && [[ "$REMOTE_DIR" != /* ]]
          case "$ACTION" in
            status) test "$POTVRZENI" = OVERIT-UPOZORNENI ;;
            install|process) test "$POTVRZENI" = ZAPNOUT-UPOZORNENI ;;
            *) exit 64 ;;
          esac
          for key in SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do test -n "${!key}"; done
          PORT="${SSH_PORT_SECRET:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          if [ "$PORT" = 22 ]; then LOOKUP="$SSH_HOST_SECRET"; else LOOKUP="[$SSH_HOST_SECRET]:$PORT"; fi
          ssh-keygen -F "$LOOKUP" -f ~/.ssh/known_hosts >/dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"
      - name: Provést operaci nasazeného workeru
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          source .github/scripts/production-ssh-retry.sh
          production_ssh_init
          EXPECTED_WORKER_SHA=$(sha256sum bin/staff-notification-operations.php | cut -d' ' -f1)
          cat > /tmp/run-staff-notifications.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('STAFF_NOTIFICATION_ACTION=$ACTION');
          putenv('STAFF_NOTIFICATION_OPERATIONS_DIR=' . __DIR__);
          if (!hash_equals('$EXPECTED_WORKER_SHA', (string)hash_file('sha256', '$REMOTE_DIR/bin/staff-notification-operations.php'))) {
              throw new RuntimeException('Deploy the reviewed staff worker first.');
          }
          require '$REMOTE_DIR/bin/staff-notification-operations.php';
          EOF
          production_retry "${SCP[@]}" /tmp/run-staff-notifications.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-staff-notifications-$GITHUB_RUN_ID.php"
          production_retry "${SSH[@]}" "php '$DEPLOY_BASE/run-staff-notifications-$GITHUB_RUN_ID.php'" | tee /tmp/staff-notifications-result.json
          jq -e '.ok == true' /tmp/staff-notifications-result.json >/dev/null
      - name: Uchovat neosobní provozní výsledek
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staff-notifications-operation
          path: /tmp/staff-notifications-result.json
          retention-days: 14
      - name: Uklidit pouze bootstrap tohoto běhu
        if: always()
        continue-on-error: true
        run: |
          rm -f /tmp/run-staff-notifications.php /tmp/staff-notifications-result.json
          if [ -n "${SSH_HOST:-}" ] && [ -n "${SSH_PORT:-}" ] && [ -n "${SSH_USER:-}" ]; then
            source .github/scripts/production-ssh-retry.sh
            production_ssh_init
            production_retry "${SSH[@]}" "rm -f -- '$DEPLOY_BASE/run-staff-notifications-$GITHUB_RUN_ID.php'"
          fi
