name: Nasadit produkci

on:
  workflow_dispatch:
    inputs:
      potvrzeni:
        description: 'Pro nasazení napište přesně NASADIT'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

# Cílový server má chroot SSH bez funkčního $HOME a s nezapisovatelným
# kořenem; všechny cesty jsou proto RELATIVNÍ k přihlašovacímu adresáři
# a deploy stav žije v soukromém adresáři data/.
env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  WEB_URL: ${{ vars.KIS_WEB_URL }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  DEPLOY_BASE: data/.kis-deploy
  BACKUP_DIR: data/.kis-backups
  RELEASE_DIR: data/.kis-deploy/releases/${{ github.sha }}-${{ github.run_id }}

jobs:
  nasadit:
    name: Nasazení KIS (kis.kovopraha.cz)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Ověřit ruční potvrzení
        env:
          POTVRZENI: ${{ inputs.potvrzeni }}
        run: |
          if [ "$POTVRZENI" != 'NASADIT' ]; then
            echo '❌ Nasazení nebylo potvrzeno přesným slovem NASADIT.'
            exit 1
          fi

      - name: Ověřit konfigurační Variables
        run: |
          for promenna in APP_HOST WEB_URL REMOTE_DIR; do
            if [ -z "${!promenna}" ]; then
              echo "❌ Chybí GitHub Variable pro ${promenna} (KIS_APP_HOST / KIS_WEB_URL / KIS_REMOTE_DIR)."
              exit 1
            fi
          done
          case "$REMOTE_DIR" in
            /*|*..*) echo '❌ KIS_REMOTE_DIR musí být relativní cesta bez ..'; exit 1 ;;
          esac
          echo "✅ Cíl: $APP_HOST → $REMOTE_DIR ($WEB_URL)"

      - name: Stáhnout kód z main
        uses: actions/checkout@v7

      - name: Připravit PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, zip, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Kontrola PHP syntaxe
        run: |
          CHYBY=0
          while IFS= read -r -d '' soubor; do
            php -l "$soubor" > /dev/null || CHYBY=1
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0)
          if [ "$CHYBY" -ne 0 ]; then
            echo '❌ Některý PHP soubor nemá platnou syntaxi.'
            exit 1
          fi
          echo '✅ PHP syntaxe je v pořádku.'

      - name: Nainstalovat závislosti a spustit testy
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress
          composer audit --locked
          composer check-platform-reqs
          composer test
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Připravit ověřené SSH spojení
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for promenna in SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do
            if [ -z "${!promenna}" ]; then
              echo "❌ Chybí povinný GitHub Secret: ${promenna%_SECRET}."
              exit 1
            fi
          done

          PORT="${SSH_PORT_SECRET:-22}"
          if ! [[ "$PORT" =~ ^[0-9]+$ ]] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            echo '❌ SSH_PORT není platný port.'
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo '❌ SSH_PRIVATE_KEY neobsahuje platný privátní klíč.'
            exit 1
          fi

          if [ "$PORT" = '22' ]; then
            HLEDAT="$SSH_HOST_SECRET"
          else
            HLEDAT="[$SSH_HOST_SECRET]:$PORT"
          fi
          if ! ssh-keygen -F "$HLEDAT" -f ~/.ssh/known_hosts > /dev/null; then
            echo '❌ SSH_KNOWN_HOSTS neobsahuje záznam pro nastavený server a port.'
            echo '   Otisk klíče musí být ověřen mimo tento workflow u hostingu.'
            exit 1
          fi

          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"

      - name: Předletová kontrola serveru bez změny aplikace
        run: |
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          "${SSH[@]}" "
            set -eu
            umask 077
            test -d '$REMOTE_DIR'
            test -s '$REMOTE_DIR/config.php'
            command -v php >/dev/null
            command -v rsync >/dev/null
            php -r 'foreach ([\"pdo_mysql\",\"zlib\",\"json\",\"hash\"] as \$e) { if (!extension_loaded(\$e)) { fwrite(STDERR, \"missing extension: \".\$e.PHP_EOL); exit(1); } }'
            APP_HOST='$APP_HOST' APP_ROOT='$REMOTE_DIR' php -r '
              \$host = (string)getenv(\"APP_HOST\");
              \$_SERVER[\"HTTP_HOST\"] = \$host;
              \$_SERVER[\"SERVER_NAME\"] = \$host;
              require getenv(\"APP_ROOT\").\"/config.php\";
              if (!defined(\"JE_LOKALNE\") || JE_LOKALNE) { exit(1); }
              foreach ([\"DB_HOST\",\"DB_NAME\",\"DB_USER\",\"DB_PASS\"] as \$constant) {
                if (!defined(\$constant)) { exit(1); }
              }
              \$pepper = defined(\"AUTH_RATE_LIMIT_PEPPER\") ? constant(\"AUTH_RATE_LIMIT_PEPPER\") : null;
              if (!is_string(\$pepper) || strlen(\$pepper) < 32) {
                fwrite(STDERR, \"AUTH_RATE_LIMIT_PEPPER is missing or too short.\".PHP_EOL);
                exit(1);
              }
            '
            mkdir -p '$DEPLOY_BASE/releases'
            chmod 700 '$DEPLOY_BASE' '$DEPLOY_BASE/releases'
          "
          echo '✅ Server, config.php a potřebná PHP rozšíření jsou dostupné.'

      - name: Nahrát zálohovací nástroj mimo aplikaci
        run: |
          SCP=(scp -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          "${SCP[@]}" bin/db-backup.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/db-backup.php.partial"
          "${SSH[@]}" "
            set -eu
            umask 077
            php -l '$DEPLOY_BASE/db-backup.php.partial' >/dev/null
            chmod 600 '$DEPLOY_BASE/db-backup.php.partial'
            mv '$DEPLOY_BASE/db-backup.php.partial' '$DEPLOY_BASE/db-backup.php'
          "

      - name: Vytvořit a ověřit produkční zálohu
        run: |
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          VYSLEDEK=$("${SSH[@]}" "
            set -eu
            umask 077
            APP_HOST='$APP_HOST' DEPLOY_GIT_SHA='$GITHUB_SHA' DEPLOY_RUN_ID='$GITHUB_RUN_ID' \\
              php '$DEPLOY_BASE/db-backup.php' \\
              --app-root='$REMOTE_DIR' \\
              --backup-dir='$BACKUP_DIR' \\
              --keep=20 \\
              --json
          ")
          echo "$VYSLEDEK"
          echo "$VYSLEDEK" | jq -e '.ok == true and .tables > 0 and (.sha256 | length == 64)' >/dev/null
          echo '✅ Ověřená záloha vznikla mimo webový adresář. Teprve nyní se smí měnit aplikace.'

      - name: Připravit kompletní release mimo webroot
        run: |
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          "${SSH[@]}" "
            set -eu
            umask 077
            mkdir -p '$RELEASE_DIR'
            chmod 700 '$RELEASE_DIR'
          "
          rsync -az --itemize-changes \
            -e "ssh -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            --exclude='.git*' \
            --exclude='config.php' \
            --exclude='uploads/' \
            --exclude='nahrane_obrazky/' \
            --exclude='nahrane_zavody/' \
            --exclude='stories/' \
            --exclude='loga_story/' \
            --exclude='reports/' \
            --exclude='bin/zalohy/' \
            --exclude='tests/' \
            --exclude='phpunit.xml*' \
            --exclude='.phpunit.cache/' \
            --exclude='*.log' \
            ./ "$SSH_USER@$SSH_HOST:$RELEASE_DIR/"
          "${SSH[@]}" "
            set -eu
            umask 077
            cp '$REMOTE_DIR/config.php' '$RELEASE_DIR/config.php'
            chmod 600 '$RELEASE_DIR/config.php'
            test -s '$RELEASE_DIR/bin/migrate.php'
            test -s '$RELEASE_DIR/config.php'
          "
          echo '✅ Kompletní release je připravený mimo veřejný webroot.'

      - name: Aplikovat migrace z připraveného release
        run: |
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          "${SSH[@]}" "cd '$RELEASE_DIR' && APP_HOST='$APP_HOST' php bin/migrate.php --apply --json"
          "${SSH[@]}" "cd '$RELEASE_DIR' && APP_HOST='$APP_HOST' php bin/migrate.php --check --json"
          echo '✅ Migrace jsou aktuální; produkční PHP zatím nebylo aktivováno.'

      - name: Aktivovat ověřený release
        run: |
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          "${SSH[@]}" "
            set -eu
            rsync -a --itemize-changes \\
              --exclude='config.php' \\
              --exclude='uploads/' \\
              --exclude='nahrane_obrazky/' \\
              --exclude='nahrane_zavody/' \\
              --exclude='stories/' \\
              --exclude='loga_story/' \\
              --exclude='reports/' \\
              --exclude='bin/zalohy/' \\
              --exclude='*.log' \\
              '$RELEASE_DIR/' '$REMOTE_DIR/'
          "
          echo '✅ Ověřený release byl aktivován. rsync záměrně nepoužívá --delete.'

      - name: HTTP smoke test bez tajného tokenu
        run: |
          KOD=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "$WEB_URL/index.php")
          echo "Web odpověděl HTTP $KOD."
          if [ "$KOD" != '200' ] && [ "$KOD" != '302' ]; then
            echo '❌ Veřejný web po nasazení neodpovídá očekávaně.'
            exit 1
          fi
          echo '✅ Nasazení dokončeno.'

      - name: Odstranit kopii produkční konfigurace z release
        if: always()
        continue-on-error: true
        run: |
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          "${SSH[@]}" "rm -f -- '$RELEASE_DIR/config.php'"
