name: Nové rodičovské obnovy po incidentu

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Čtecí inventura nebo jednorázové vydání dvou nových odkazů'
        required: true
        type: choice
        options: [inspect, issue]
      old_ids:
        description: 'Pouze pro issue: dvě ID starých zrušených zpráv z inspect, vzestupně a oddělená čárkou'
        required: false
        type: string
      potvrzeni:
        description: 'OVERIT-DVE-OBNOVY nebo VYDAT-DVE-OBNOVY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  DEPLOY_BASE: data/.kis-deploy

jobs:
  operations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Připravit ověřené spojení
        env:
          ACTION: ${{ inputs.action }}
          OLD_IDS: ${{ inputs.old_ids }}
          POTVRZENI: ${{ inputs.potvrzeni }}
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$APP_HOST" = kis.kovopraha.cz
          [[ "$REMOTE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$REMOTE_DIR" != *..* ]] && [[ "$REMOTE_DIR" != /* ]]
          case "$ACTION" in
            inspect) test "$POTVRZENI" = OVERIT-DVE-OBNOVY && test -z "$OLD_IDS" ;;
            issue) test "$POTVRZENI" = VYDAT-DVE-OBNOVY && [[ "$OLD_IDS" =~ ^[1-9][0-9]{0,18},[1-9][0-9]{0,18}$ ]] ;;
            *) exit 64 ;;
          esac
          for key in SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do test -n "${!key}"; done
          PORT="${SSH_PORT_SECRET:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          if [ "$PORT" = 22 ]; then LOOKUP="$SSH_HOST_SECRET"; else LOOKUP="[$SSH_HOST_SECRET]:$PORT"; fi
          ssh-keygen -F "$LOOKUP" -f ~/.ssh/known_hosts >/dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"
      - name: Provést pouze zvolenou operaci nasazeného kódu
        env:
          ACTION: ${{ inputs.action }}
          OLD_IDS: ${{ inputs.old_ids }}
        run: |
          set -euo pipefail
          source .github/scripts/production-ssh-retry.sh
          production_ssh_init
          EXPECTED_OPERATION_SHA=$(sha256sum bin/parent-reset-reissue-operations.php | cut -d' ' -f1)
          EXPECTED_REISSUE_SHA=$(sha256sum includes/parent_reset_reissue.php | cut -d' ' -f1)
          EXPECTED_RESET_SHA=$(sha256sum includes/password_reset.php | cut -d' ' -f1)
          EXPECTED_OUTBOX_SHA=$(sha256sum includes/auth_mail_outbox.php | cut -d' ' -f1)
          EXPECTED_SCHEDULER_SHA=$(sha256sum includes/parent_auth_mail_scheduler.php | cut -d' ' -f1)
          cat > /tmp/run-parent-reset-reissue.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('PARENT_RESET_ACTION=$ACTION');
          putenv('PARENT_RESET_OLD_IDS=$OLD_IDS');
          putenv('PARENT_RESET_OPERATIONS_DIR=' . __DIR__);
          foreach (['bin/parent-reset-reissue-operations.php'=>'$EXPECTED_OPERATION_SHA', 'includes/parent_reset_reissue.php'=>'$EXPECTED_REISSUE_SHA', 'includes/password_reset.php'=>'$EXPECTED_RESET_SHA', 'includes/auth_mail_outbox.php'=>'$EXPECTED_OUTBOX_SHA', 'includes/parent_auth_mail_scheduler.php'=>'$EXPECTED_SCHEDULER_SHA'] as \$file=>\$hash) {
              if (!hash_equals(\$hash, (string)hash_file('sha256', '$REMOTE_DIR/' . \$file))) { throw new RuntimeException('Deploy reviewed reset code first.'); }
          }
          require '$REMOTE_DIR/bin/parent-reset-reissue-operations.php';
          EOF
          production_retry "${SCP[@]}" /tmp/run-parent-reset-reissue.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-parent-reset-reissue-$GITHUB_RUN_ID.php"
          production_retry "${SSH[@]}" "php '$DEPLOY_BASE/run-parent-reset-reissue-$GITHUB_RUN_ID.php'" | tee /tmp/parent-reset-reissue-result.json
          jq -e '.ok == true' /tmp/parent-reset-reissue-result.json >/dev/null
      - name: Uchovat bezpečný výsledek
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parent-reset-reissue-operation
          path: /tmp/parent-reset-reissue-result.json
          retention-days: 14
      - name: Uklidit pouze bootstrap tohoto běhu
        if: always()
        continue-on-error: true
        run: |
          rm -f /tmp/run-parent-reset-reissue.php /tmp/parent-reset-reissue-result.json
          if [ -n "${SSH_HOST:-}" ] && [ -n "${SSH_PORT:-}" ] && [ -n "${SSH_USER:-}" ]; then
            source .github/scripts/production-ssh-retry.sh
            production_ssh_init
            production_retry "${SSH[@]}" "rm -f -- '$DEPLOY_BASE/run-parent-reset-reissue-$GITHUB_RUN_ID.php'"
          fi
