name: PHP quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: PHPStan level 5 and changed-file style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, zip, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: PHPStan analysis against the reviewed baseline
        run: composer analyse
      - name: Verify anonymous inventory after analysis has populated its cache
        run: |
          test ! -e .phpstan-cache
          php tests/Support/AnonymousSweep.php
          php vendor/bin/phpunit --filter 'AnonymousSweepPolicyTest|StaffWorkspaceRegistryTest|DeploymentExposureTest|SharedUiShellTest'
      - name: PSR-12, line length and control-flow braces on PR files only
        if: github.event_name == 'pull_request'
        env:
          STYLE_BASE_REF: origin/${{ github.base_ref }}
        run: composer style:check
