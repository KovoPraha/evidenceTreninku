name: Testy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit na PHP 8.2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Stáhnout kód
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Připravit PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2, verified tag 2026-06-08
        with:
          php-version: '8.2'
          extensions: mbstring, gd, zip, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Ověřit Composer konfiguraci
        run: composer validate --strict

      - name: Nainstalovat závislosti
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Ověřit známé zranitelnosti závislostí
        run: composer audit --locked --no-interaction

      - name: Ověřit anonymní přístup ke všem neveřejným trasám
        run: php tests/Support/AnonymousSweep.php

      - name: Ověřit JavaScript trenérských formulářů a plánovače
        run: node --test tests/Support/PlannerJavascriptSmoke.cjs tests/Support/TrainingEditJavascriptSmoke.cjs tests/Support/FormularAutocompleteKeyboardSmoke.cjs tests/Support/StressAthletePickerSmoke.cjs tests/Support/AppUiSubmissionSmoke.cjs tests/Support/AppUiFieldNamesSmoke.cjs tests/Support/PasswordResetJavascriptSmoke.cjs

      - name: Spustit testy
        run: composer test

      - name: Ověřit serverové předání ranní kontroly členství
        run: python3 tests/Support/test_membership_audit_publication.py

      - name: Ověřit ruční obnovu barového potvrzení po ztrátě odpovědi
        run: node --test tests/Support/BarRequestRecoveryJavascriptSmoke.cjs

      - name: Ověřit původní střídání tří karet barové obrazovky
        run: node --test tests/Support/BarScreenJavascriptSmoke.cjs

      - name: Ověřit TV přehrávač a přebírání zveřejněných změn
        run: node --test tests/Support/TvPlayerSmoke.cjs

      - name: Ověřit šifrovaný přenos vyhrazeného TV testovacího přístupu
        run: node --test tests/Support/TvUatEnvelopeSmoke.cjs

      - name: Ověřit šifrované předání případného nového hesla jediné barové obsluhy
        run: node --test tests/Support/BarCredentialEnvelopeSmoke.cjs

      - name: Ověřit unixové hranice soukromého úložiště bez přeskočení
        run: |
          php -r 'if (PHP_OS_FAMILY !== "Linux") { exit(1); }'
          vendor/bin/phpunit --colors=never --fail-on-skipped --testdox --filter 'testCanonicalPublicSymlinkFailsBeforeWriting|testCleanupDoesNotFollowOrDeleteReplacementSymlink|testRefusesSymlinkedDataBeforeChanges'

      - name: Verify indexed financial export projection
        run: php tests/Support/AccountingExportReadProfile.php > accounting-export-read-profile.json

      - name: Preserve financial projection profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accounting-export-read-profile
          path: accounting-export-read-profile.json
          retention-days: 14

      - name: Verify bounded complete XLSX serialization
        run: php tests/Support/AccountingSerializationProfile.php > accounting-serialization-profile.json

      - name: Preserve XLSX serialization profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accounting-serialization-profile
          path: accounting-serialization-profile.json
          retention-days: 14

      - name: Verify ordered club financial projections
        run: php tests/Support/AccountingClubReadProfile.php > accounting-club-read-profile.json

      - name: Preserve club financial projection profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accounting-club-read-profile
          path: accounting-club-read-profile.json
          retention-days: 14

      - name: Verify XLSX parser lifecycle and equivalent results
        run: php tests/Support/KisParserProfile.php > kis-parser-profile.json

      - name: Preserve parser lifecycle profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kis-parser-profile
          path: kis-parser-profile.json
          retention-days: 14

  mariadb-smoke:
    name: MariaDB integrační smoke (MariaDB ${{ matrix.mariadb-version }})
    runs-on: ubuntu-latest
    # Includes paired catalog profiles and all existing integration contracts.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # 10.3 = produkční kompatibilní podlaha (replikant3544, viz
        # docs/mariadb-10.3-compatibility-2026-08-06.md), 11.4 = dosavadní CI
        # verze. Localhost vývoj běží na 10.4.32, mezi oběma maticovými verzemi.
        mariadb-version: ['10.3', '11.4']

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Stáhnout kód
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Připravit PHP s MariaDB ovladačem
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2, verified tag 2026-06-08
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, zip
          coverage: none

      - name: Nainstalovat závislosti pro účetní doklady a exporty
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Ověřit čtecí metadatovou inventuru sportovních tabulek
        env:
          EVIDENCE_ROSTER_READ_MARIADB: '1'
          EVIDENCE_MARIADB_SMOKE_PORT: '3306'
        run: php vendor/bin/phpunit tests/Integration/AthleteReadSchemaInventoryTest.php

      - name: Ověřit přístup sportovce na MariaDB
        run: php tests/Support/ChildAccessMariaDbSmoke.php

      - name: Ověřit KIS přechod a idempotenci na MariaDB
        run: php tests/Support/KisHobbyTransitionMariaDbSmoke.php

      - name: Ověřit skutečnou Evidence zálohu na MariaDB
        run: php tests/Support/DatabaseBackupMariaDbSmoke.php

      - name: Ověřit měsíční členství, trvalou platbu a soukromý PDF doklad
        run: php tests/Support/MonthlyMembershipMariaDbSmoke.php

      - name: Ověřit pracovní upozornění a zrušení neaktuálních e-mailů
        run: php tests/Support/StaffNotificationsMariaDbSmoke.php

      - name: Ověřit převod členství bez sezon a opakování operací
        run: php tests/Support/MemberEvidenceMariaDbSmoke.php

      - name: Ověřit opravu indexů VS, upgrade a zachování plateb na MariaDB
        run: php tests/Support/PaymentVariableSymbolMariaDbSmoke.php

      - name: Ověřit souběžný idempotentní checkout na MariaDB
        run: php tests/Support/ShopCheckoutMariaDbSmoke.php

      - name: Ověřit ruční původ katalogu na MariaDB
        run: php tests/Support/ShopManualCatalogOriginMariaDbSmoke.php

      - name: Ověřit rozpočet SQL a cílené čtení veřejného katalogu
        run: php tests/Support/StorefrontReadMariaDbSmoke.php

      - name: Ověřit programové projekce a čerstvou kapacitu při zamčení
        run: php tests/Support/ProgramStorefrontMariaDbSmoke.php

      - name: Ověřit katalogové karty bez opakovaných dotazů
        run: php tests/Support/CatalogCardsMariaDbSmoke.php

      - name: Ověřit dávkové klubové ceny, kolace a nezměněné transakční čtení
        run: php tests/Support/MemberPricingReadMariaDbSmoke.php > member-pricing-parity.json

      - name: Změřit původní a dávkové čtení klubových cen na stejných datech
        env:
          EVIDENCE_PERFORMANCE_CONFIRM: SYNTHETIC-ONLY
          EVIDENCE_MARIADB_SMOKE_PORT: '3306'
          EVIDENCE_PERFORMANCE_DATADIR: /var/lib/mysql
        run: php tests/Support/MemberPricingReadProfile.php --mariadb > member-pricing-comparison.json

      - name: Porovnat katalogové stránky a změřit omezenou prezentaci
        env:
          EVIDENCE_PERFORMANCE_CONFIRM: SYNTHETIC-ONLY
          EVIDENCE_MARIADB_SMOKE_PORT: '3306'
          EVIDENCE_PERFORMANCE_DATADIR: /var/lib/mysql
        run: php tests/Support/CatalogPageProfile.php --mariadb > catalog-page-comparison.json

      - name: Uchovat katalogovou paritu a měření
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-page-read-${{ matrix.mariadb-version }}
          path: catalog-page-comparison.json
          retention-days: 14

      - name: Porovnat nabídku lekcí a dávkové současné oprávnění
        env:
          EVIDENCE_PERFORMANCE_CONFIRM: SYNTHETIC-ONLY
          EVIDENCE_MARIADB_SMOKE_PORT: '3306'
          EVIDENCE_PERFORMANCE_DATADIR: /var/lib/mysql
        run: php tests/Support/TrainingDayChoicesProfile.php --mariadb > attendance-lesson-comparison.json

      - name: Uchovat nabídku lekcí a párové měření
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attendance-lesson-read-${{ matrix.mariadb-version }}
          path: attendance-lesson-comparison.json
          retention-days: 14

      - name: Uchovat shodu a párové měření klubových cen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: member-pricing-read-${{ matrix.mariadb-version }}
          path: |
            member-pricing-parity.json
            member-pricing-comparison.json
          retention-days: 14

      - name: Ověřit dávkové podmínky, kolace a čerstvé zamykající čtení
        run: php tests/Support/ProgramTermsBatchMariaDbSmoke.php

      - name: Ověřit dávkové nabídky a vazby fyzických týmů
        run: php tests/Support/ProgramOfferBatchMariaDbSmoke.php

      - name: Ověřit charakterizaci kapacity na MariaDB s nativními prepared statements
        env:
          EVIDENCE_CAPACITY_MARIADB: '1'
        run: php vendor/bin/phpunit tests/Integration/ProgramCapacityCharacterizationTest.php

      - name: Porovnat kapacity a SQL s výchozím kódem před extrakcí
        run: php tests/Support/ProgramCapacityComparison.php > capacity-profile.json

      - name: Uchovat měření kapacity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capacity-profile-mariadb-${{ matrix.mariadb-version }}
          path: capacity-profile.json
          retention-days: 14

      - name: Ověřit paměť kapacity na kompletně migrovaném schématu
        run: php tests/Support/ProgramCapacityMigratedProfile.php > capacity-migrated-profile.json

      - name: Uchovat profil migrovaného schématu
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capacity-migrated-profile-mariadb-${{ matrix.mariadb-version }}
          path: capacity-migrated-profile.json
          retention-days: 14

      - name: Ověřit pracovní pozice a superadmin audit na MariaDB
        run: php tests/Support/StaffWorkspaceMariaDbSmoke.php

      - name: Ověřit oddělený trenérský pilot na migrovaném schématu
        run: php tests/Support/TrainerPilotMariaDbSmoke.php

      - name: Ověřit cílený rodinný přístup a revokaci na MariaDB
        env:
          EVIDENCE_FAMILY_MARIADB: '1'
        run: php vendor/bin/phpunit tests/Integration/FamilyPortalTargetedReadTest.php tests/Integration/FamilyMembershipBatchTest.php

      - name: Ověřit revokaci během skutečného čekání RSVP a náhrad
        run: php tests/Support/FamilyWriteAuthorizationRace.php > family-write-authorization-race.json

      - name: Uchovat souběhové autorizační kontroly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: family-write-authorization-mariadb-${{ matrix.mariadb-version }}
          path: family-write-authorization-race.json
          retention-days: 14

      - name: Ověřit rozpočet rodinného přístupu na migrovaném schématu
        run: php tests/Support/FamilyPortalReadProfile.php > family-read-profile.json

      - name: Porovnat celou rodinnou stránku, HTML a rozpočet SQL
        run: php tests/Support/FamilyOverviewPageProfile.php > family-overview-profile.json

      - name: Uchovat profil celého rodinného přehledu
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: family-overview-profile-mariadb-${{ matrix.mariadb-version }}
          path: family-overview-profile.json
          retention-days: 14

      - name: Uchovat profil rodinného přístupu
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: family-read-profile-mariadb-${{ matrix.mariadb-version }}
          path: family-read-profile.json
          retention-days: 14

      - name: Ověřit metadata a sekce rodinného přehledu
        run: |
          php tests/Support/FamilySchemaPageProfile.php > family-schema-profile.json
          php tests/Support/FamilySchemaPageProfile.php --family-size=20 --history > family-schema-history.json
          php tests/Support/FamilySchemaPageProfile.php --post > family-schema-post.json

      - name: Uchovat profil metadat a historie rodiny
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: family-schema-profile-mariadb-${{ matrix.mariadb-version }}
          path: |
            family-schema-profile.json
            family-schema-history.json
            family-schema-post.json
          retention-days: 14

      - name: Ověřit dávkové členství ve všech rodinných sekcích
        run: |
          php tests/Support/FamilyMembershipPageProfile.php > family-membership-profile.json
          php tests/Support/FamilyMembershipPageProfile.php --family-size=20 --history > family-membership-history.json
          php tests/Support/FamilyMembershipPageProfile.php --post > family-membership-post.json

      - name: Uchovat profil dávkového členství
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: family-membership-profile-mariadb-${{ matrix.mariadb-version }}
          path: |
            family-membership-profile.json
            family-membership-history.json
            family-membership-post.json
          retention-days: 14

      - name: Ověřit zveřejnění registračních textů a souběh na MariaDB
        run: php tests/Support/RegistrationTextsMariaDbSmoke.php

      - name: Ověřit migraci a zveřejnění TV programů na MariaDB
        run: php tests/Support/TvProgramsMariaDbSmoke.php

      - name: Ověřit barové role a odvolání vlastní spotřeby v aktuální transakci
        run: php tests/Support/BarFoundationMariaDbSmoke.php

      - name: Ověřit převod baru, soukromé fotografie, technický účet a sklad
        run: php tests/Support/BarTransferMariaDbSmoke.php

      - name: Ověřit pokladnu baru a skutečné souběhy prodeje, práv a uzávěrky
        run: php tests/Support/BarCheckoutMariaDbSmoke.php

      - name: Ověřit příjem faktur a souběh účetních exportů
        run: php tests/Support/BarDocumentsMariaDbSmoke.php

      - name: Ověřit obnovu spojení a nouzové vypořádání kas
        run: php tests/Support/BarRecoveryMariaDbSmoke.php

      - name: Ověřit chráněný převod baru, původní fotografie a přidělení práv
        run: |
          php tests/Support/BarCutoverMariaDbSmoke.php
          BAR_NATIVE_REPLACE_PASSWORD=1 php tests/Support/BarCutoverMariaDbSmoke.php

      - name: Ověřit rodinný kalendář a cílené historické členství
        env:
          EVIDENCE_CALENDAR_READ_MARIADB: '1'
        run: |
          php vendor/bin/phpunit tests/Integration/FamilyCalendarReadOptimizationTest.php
          php tests/Support/FamilyCalendarReadProfile.php > family-calendar-read-profile.json

      - name: Uchovat profil rodinného kalendáře
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: family-calendar-read-profile-mariadb-${{ matrix.mariadb-version }}
          path: family-calendar-read-profile.json
          retention-days: 14

      - name: Ověřit systémové e-maily a souběh editorů na MariaDB
        run: php tests/Support/ShopSystemEmailMariaDbSmoke.php

      - name: Ověřit číselné řady, souběh nákupů a editorů na MariaDB
        run: php tests/Support/ShopNumberSeriesMariaDbSmoke.php

      - name: Ověřit M3.5d sportovní import review na MariaDB
        run: php bin/sports-review-smoke.php

      - name: Ověřit úplný import osob, rollback a vazby na MariaDB
        run: php tests/Support/KisPersonImportMariaDbSmoke.php

      - name: Ověřit historické soupisky a rozhodovací frontu na MariaDB
        run: php tests/Support/KisLegacyRosterMariaDbSmoke.php

      - name: Ověřit převod do aktuálních soupisek a rozhodovací frontu na MariaDB
        run: php tests/Support/KisCurrentRosterMariaDbSmoke.php

      - name: Ověřit editaci rodičů, RČ, soupisek a plateb sportovce na MariaDB
        run: php tests/Support/SportovecEditorMariaDbSmoke.php

      - name: Ověřit stránkování a paměť adresáře registráře
        run: php tests/Support/SportovecDirectoryProfile.php > sportovec-directory-profile.json

      - name: Ověřit historickou časovou osu a rozpočet dotazů
        env:
          EVIDENCE_TIMELINE_MARIADB: '1'
        run: |
          php vendor/bin/phpunit tests/Integration/AthleteTimelineReadOptimizationTest.php
          php tests/Support/AthleteTimelineProfile.php > athlete-timeline-profile.json
          php tests/Support/PersonReadAssessment.php > person-read-assessment.json

      - name: Uchovat profil časové osy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: athlete-timeline-profile-mariadb-${{ matrix.mariadb-version }}
          path: |
            athlete-timeline-profile.json
            person-read-assessment.json
          retention-days: 14

      - name: Uchovat profil adresáře registráře
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sportovec-directory-profile-mariadb-${{ matrix.mariadb-version }}
          path: sportovec-directory-profile.json
          retention-days: 14

      - name: Ověřit historické filtry a náhled kopírování
        env:
          EVIDENCE_ROSTER_READ_MARIADB: '1'
        run: |
          php vendor/bin/phpunit tests/Integration/TrainingRosterFilterReadTest.php tests/Integration/PlannerCopyCountTest.php
          php tests/Support/TrainingRosterFilterProfile.php > training-roster-filter-profile.json

      - name: Uchovat profil sportovních filtrů
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: training-roster-filter-profile-mariadb-${{ matrix.mariadb-version }}
          path: training-roster-filter-profile.json
          retention-days: 14

      - name: Ověřit stavový filtr zdravotního přehledu proti zmrazenému main
        env:
          EVIDENCE_ROSTER_READ_MARIADB: '1'
        run: php vendor/bin/phpunit tests/Integration/MedicalStateReadTest.php

      - name: Změřit zdravotní stavový filtr před a po na jedné syntetické historii
        env:
          EVIDENCE_PERFORMANCE_CONFIRM: SYNTHETIC-ONLY
          EVIDENCE_MARIADB_SMOKE_PORT: '3306'
          EVIDENCE_PERFORMANCE_DATADIR: /var/lib/mysql
        run: php tests/Support/MedicalStateProfile.php > medical-state-comparison.json

      - name: Uchovat paritu a párové měření zdravotního přehledu
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: medical-state-${{ matrix.mariadb-version }}
          path: medical-state-comparison.json
          retention-days: 30

      - name: Ověřit historický souhrn plánovače proti zmrazenému main
        env:
          EVIDENCE_ROSTER_READ_MARIADB: '1'
        run: php vendor/bin/phpunit tests/Integration/PlannerHierarchyReadTest.php

      - name: Změřit souhrn plánovače před a po na jedné syntetické historii
        env:
          EVIDENCE_PERFORMANCE_CONFIRM: SYNTHETIC-ONLY
          EVIDENCE_MARIADB_SMOKE_PORT: '3306'
          EVIDENCE_PERFORMANCE_DATADIR: /var/lib/mysql
        run: php tests/Support/PlannerHierarchyProfile.php > planner-hierarchy-comparison.json

      - name: Uchovat paritu a párové měření plánovače
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: planner-hierarchy-${{ matrix.mariadb-version }}
          path: planner-hierarchy-comparison.json
          retention-days: 30

      - name: Ověřit revize výsledků a řízený KIS převod na MariaDB
        run: php tests/Support/RaceKisReviewMariaDbSmoke.php

      - name: Ověřit dávkové čtení klubového kalendáře
        run: php tests/Support/ClubCalendarReadProfile.php > club-calendar-read-profile.json

      - name: Uchovat profil klubového kalendáře
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: club-calendar-read-profile-mariadb-${{ matrix.mariadb-version }}
          path: club-calendar-read-profile.json
          retention-days: 14

      - name: Ověřit skutečné souběhy rezervací a sportovní historie
        run: |
          php tests/Support/BookingControllerMariaDbRace.php > booking-controller-race.json
          php tests/Support/TrainingClosureMariaDbRace.php > training-closure-race.json
          php tests/Support/TrainingClosureAuthorizationRace.php > training-authorization-race.json
          php tests/Support/MedicalClearanceMariaDbRace.php > medical-clearance-race.json
          php tests/Support/SportReadWriteAssessment.php > sport-read-write-assessment.json

      - name: Uchovat sportovní kontrakty a měření
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sport-contracts-mariadb-${{ matrix.mariadb-version }}
          path: |
            booking-controller-race.json
            training-closure-race.json
            training-authorization-race.json
            medical-clearance-race.json
            sport-read-write-assessment.json
          retention-days: 14

      - name: Verify real inventory and fulfillment races
        run: |
          php tests/Support/ShopInventoryMariaDbRace.php > inventory-race.json
          php tests/Support/ShopReturnsMariaDbRace.php > returns-race.json
          php tests/Support/ShopFulfillmentMariaDbRace.php > fulfillment-race.json

      - name: Preserve stock race evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stock-races-mariadb-${{ matrix.mariadb-version }}
          path: |
            inventory-race.json
            returns-race.json
            fulfillment-race.json
          retention-days: 14

  mariadb-read-profiles:
    name: MariaDB profily čtení (MariaDB ${{ matrix.mariadb-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 10.3 = produkční kompatibilní podlaha (replikant3544, viz
        # docs/mariadb-10.3-compatibility-2026-08-06.md), 11.4 = dosavadní CI
        # verze. Localhost vývoj běží na 10.4.32, mezi oběma maticovými verzemi.
        mariadb-version: ['10.3', '11.4']

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Stáhnout kód
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Připravit PHP s MariaDB ovladačem
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2, verified tag 2026-06-08
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, zip
          coverage: none

      - name: Nainstalovat závislosti pro účetní doklady a exporty
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Ověřit celou skladovou stránku a dávkové zůstatky
        run: php tests/Support/InventoryPageProfile.php > inventory-page-profile.json

      - name: Uchovat profil skladové stránky
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inventory-page-profile-mariadb-${{ matrix.mariadb-version }}
          path: inventory-page-profile.json
          retention-days: 14

      - name: Compare complete cart projections and query budgets
        run: php tests/Support/ShopCartReadProfile.php --enforce > cart-read-profile.json

      - name: Preserve cart read profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cart-read-profile-mariadb-${{ matrix.mariadb-version }}
          path: cart-read-profile.json
          retention-days: 14

      - name: Assess ledger and personal financial history on migrated schema
        run: php tests/Support/FinancialReadAssessment.php > financial-read-assessment.json

      - name: Verify notification races and bounded queue processing
        run: |
          php tests/Support/OperationalDeliveryMariaDbRace.php > notification-delivery-race.json
          php tests/Support/NotificationQueueProfile.php > notification-queue-profile.json
          php tests/Support/RosterMessageRecipientProfile.php > roster-message-recipient-profile.json

      - name: Preserve notification contracts and profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notification-contracts-mariadb-${{ matrix.mariadb-version }}
          path: |
            notification-delivery-race.json
            notification-queue-profile.json
            roster-message-recipient-profile.json
          retention-days: 14

      - name: Preserve financial read assessment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: financial-read-assessment-mariadb-${{ matrix.mariadb-version }}
          path: financial-read-assessment.json
          retention-days: 14

      - name: Verify import rollback, export snapshot and complete backup restoration
        run: |
          php tests/Support/ImportPreviewProfile.php > import-preview-profile.json
          php tests/Support/AccountingExportSnapshotMariaDbTest.php > export-snapshot.json
          php -d memory_limit=512M tests/Support/BackupRestoreProfile.php > backup-restore-profile.json

      - name: Preserve isolated import and recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: import-recovery-mariadb-${{ matrix.mariadb-version }}
          path: |
            import-preview-profile.json
            export-snapshot.json
            backup-restore-profile.json
          retention-days: 14

      - name: Measure synthetic planner, closure and medical GET paths
        env:
          EVIDENCE_PERFORMANCE_CONFIRM: SYNTHETIC-ONLY
          EVIDENCE_MARIADB_SMOKE_PORT: '3306'
          EVIDENCE_PERFORMANCE_DATADIR: /var/lib/mysql
        run: |
          mkdir -p synthetic-read-pages/before synthetic-read-pages/after synthetic-read-pages/planner-before synthetic-read-pages/attendance-before
          before_tree="$RUNNER_TEMP/medical-before"
          git fetch --no-tags origin fbdf622e0acadebeaf5525fb168869795a7faca2
          git worktree add --detach "$before_tree" fbdf622e0acadebeaf5525fb168869795a7faca2
          ln -s "$GITHUB_WORKSPACE/vendor" "$before_tree/vendor"
          # Keep historical application code, but compare it on the same migrated schema as HEAD.
          # The dedicated filter benchmark separately measures the new index contribution.
          cp migrations/20261107180000_shop_document_automation.php "$before_tree/migrations/"
          cp migrations/20261108070000_medical_read_covering_index.php "$before_tree/migrations/"
          cp includes/medical_clearance_read_index.php "$before_tree/includes/"
          cp docs/verification/medical-read-performance-20261106/before-harness.php.txt "$before_tree/tests/Support/MedicalReadBefore20261106.php"
          (cd "$before_tree" && php -d memory_limit=512M tests/Support/MedicalReadBefore20261106.php --run "$GITHUB_WORKSPACE/synthetic-read-pages/before")
          planner_tree="$RUNNER_TEMP/planner-before"
          git fetch --no-tags origin 84f5c7a270d2bcedd9c1bd6c627f485d4ade7c6a
          git worktree add --detach "$planner_tree" 84f5c7a270d2bcedd9c1bd6c627f485d4ade7c6a
          ln -s "$GITHUB_WORKSPACE/vendor" "$planner_tree/vendor"
          cp migrations/20261107180000_shop_document_automation.php "$planner_tree/migrations/"
          cp migrations/20261108070000_medical_read_covering_index.php "$planner_tree/migrations/"
          cp includes/medical_clearance_read_index.php "$planner_tree/includes/"
          cp docs/verification/planner-read-performance-20261106/before-harness.php.txt "$planner_tree/tests/Support/PlannerBeforeProfile.php"
          (cd "$planner_tree" && php -d memory_limit=512M tests/Support/PlannerBeforeProfile.php --run "$GITHUB_WORKSPACE/synthetic-read-pages/planner-before" --route R05)
          attendance_tree="$RUNNER_TEMP/attendance-before"
          git fetch --no-tags origin 89edfdbee5fbddbe05e0134d94f79ba0cb4143d9
          git worktree add --detach "$attendance_tree" 89edfdbee5fbddbe05e0134d94f79ba0cb4143d9
          ln -s "$GITHUB_WORKSPACE/vendor" "$attendance_tree/vendor"
          cp migrations/20261107180000_shop_document_automation.php "$attendance_tree/migrations/"
          cp migrations/20261108070000_medical_read_covering_index.php "$attendance_tree/migrations/"
          cp includes/medical_clearance_read_index.php "$attendance_tree/includes/"
          cp docs/verification/attendance-read-performance-20261107/before-harness.php.txt "$attendance_tree/tests/Support/AttendanceBeforeProfile.php"
          # R06 lesson choices depend on the preceding R05 seed: preserve the full matrix order.
          # Keep the frozen participant validator while sharing the intentionally changed picker UI.
          # Historical archived harnesses remain immutable; HTML parity still applies to this common UI.
          cp training_closure_admin.php "$attendance_tree/training_closure_admin.php"
          cp includes/training_closure_people.php "$attendance_tree/includes/training_closure_people.php"
          cp includes/training_day.php "$attendance_tree/includes/training_day.php"
          # CLI flags are not inherited by measurement workers. Import the shared UI only
          # in this generated copy; the versioned frozen harness remains unchanged.
          ATTENDANCE_PROFILE="$attendance_tree/tests/Support/AttendanceBeforeProfile.php" php <<'PHP'
          <?php
          $file = getenv('ATTENDANCE_PROFILE');
          $source = file_get_contents($file);
          $needle = "require_once dirname(__DIR__, 2) . '/includes/training_closure_form.php';";
          if (substr_count($source, $needle) !== 1) {
              throw new RuntimeException('Unexpected frozen harness import boundary.');
          }
          file_put_contents($file, str_replace($needle, $needle . "\nrequire_once dirname(__DIR__, 2) . '/includes/training_closure_people.php';", $source));
          PHP
          (cd "$attendance_tree" && php -d memory_limit=512M tests/Support/AttendanceBeforeProfile.php --run "$GITHUB_WORKSPACE/synthetic-read-pages/attendance-before")
          php tests/Support/AttendanceReadProfile.php > synthetic-read-pages/attendance-read-parity.json
          php tests/Support/AttendancePickerReadProfile.php > synthetic-read-pages/attendance-picker-parity.json
          php tests/Support/MedicalClearanceReadProfile.php > synthetic-read-pages/medical-read-parity.json
          php tests/Support/PlannerReadProfile.php > synthetic-read-pages/planner-read-parity.json
          php -d memory_limit=512M tests/Support/SyntheticReadPagesProfile.php --run synthetic-read-pages/after
          php tests/Support/CompareMedicalReadMeasurements.php synthetic-read-pages/before synthetic-read-pages/after > synthetic-read-pages/medical-comparison.json
          php tests/Support/ComparePlannerReadMeasurements.php synthetic-read-pages/planner-before synthetic-read-pages/after > synthetic-read-pages/planner-comparison.json
          php tests/Support/CompareAttendanceReadMeasurements.php synthetic-read-pages/attendance-before synthetic-read-pages/after > synthetic-read-pages/attendance-comparison.json
          jq -e '.complete == true and (.cases | length) == 24 and (.negative_checks | length) == 4' synthetic-read-pages/after/summary.json >/dev/null
          jq -e '.removed == true' synthetic-read-pages/after/cleanup.json >/dev/null
          jq -e '.complete == true and .domain_results_equal == true and (.cases | length) == 9' synthetic-read-pages/medical-comparison.json >/dev/null
          jq -e '.complete == true and .domain_results_equal == true and .html_lf_equal_except_filter_width_and_duplicate_css == true and (.cases | length) == 6' synthetic-read-pages/planner-comparison.json >/dev/null
          jq -e '.complete == true and .domain_results_equal == true and .html_lf_equal == true and (.cases | length) == 9' synthetic-read-pages/attendance-comparison.json >/dev/null

      - name: Preserve synthetic GET path measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-read-pages-mariadb-${{ matrix.mariadb-version }}
          path: synthetic-read-pages/
          if-no-files-found: error
          retention-days: 14
