name: Dohledat vlastníka trenérského pilotu

on:
  workflow_dispatch:
    inputs:
      email:
        description: Přesná vlastníkem potvrzená adresa stávajícího účtu
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  DEPLOY_BASE: data/.kis-deploy

jobs:
  lookup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Stáhnout ověřený nástroj
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Připravit ověřené SSH a soukromý vstup
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
          LOOKUP_EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          test "$APP_HOST" = kis.kovopraha.cz
          [[ "$REMOTE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]]
          case "$REMOTE_DIR" in /*|*..*) exit 2;; esac
          for variable in SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET LOOKUP_EMAIL; do test -n "${!variable}"; done
          PORT="${SSH_PORT_SECRET:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          if [ "$PORT" = 22 ]; then LOOKUP="$SSH_HOST_SECRET";else LOOKUP="[$SSH_HOST_SECRET]:$PORT";fi
          ssh-keygen -F "$LOOKUP" -f ~/.ssh/known_hosts >/dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          with open('/tmp/trainer-owner-lookup-input.json', 'w') as stream:
              json.dump({'root': os.environ['REMOTE_DIR'], 'email': os.environ['LOOKUP_EMAIL']}, stream)
          PY
      - name: Vyhledat přesnou adresu v read-only transakci
        run: |
          set -euo pipefail
          source .github/scripts/production-ssh-retry.sh
          production_ssh_init
          production_retry "${SCP[@]}" .github/scripts/trainer-owner-lookup.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/trainer-owner-lookup.php"
          production_retry "${SCP[@]}" /tmp/trainer-owner-lookup-input.json "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/trainer-owner-lookup-input.json"
          production_retry "${SSH[@]}" "chmod 600 '$DEPLOY_BASE/trainer-owner-lookup.php' '$DEPLOY_BASE/trainer-owner-lookup-input.json';php '$DEPLOY_BASE/trainer-owner-lookup.php'" | tee /tmp/trainer-owner-lookup-result.json
          jq -e '.read_only == true and .domain_mutations == false and .messages_sent == 0' /tmp/trainer-owner-lookup-result.json >/dev/null
      - name: Uklidit vlastní soukromé pomocné soubory
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${SSH_HOST:-}" ]; then
            source .github/scripts/production-ssh-retry.sh
            production_ssh_init
            production_retry "${SSH[@]}" "rm -f -- '$DEPLOY_BASE/trainer-owner-lookup.php' '$DEPLOY_BASE/trainer-owner-lookup-input.json'"
          fi
          rm -f /tmp/trainer-owner-lookup-input.json /tmp/trainer-owner-lookup-result.json
