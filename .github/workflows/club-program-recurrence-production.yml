name: Obnovit roční nabídky kroužků

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry-run or apply'
        required: true
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.KIS_CLUB_PROGRAM_RECURRENCE_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Připravit ověřené SSH spojení
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for name in APP_HOST REMOTE_DIR SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do if [ -z "${!name}" ]; then echo "Missing $name"; exit 1; fi; done
          [[ "$APP_HOST" =~ ^[a-z0-9.-]+$ ]] || exit 1
          [[ "$REMOTE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$REMOTE_DIR" in /*|*..*) exit 1;; esac
          PORT="${SSH_PORT_SECRET:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          if [ "$PORT" = 22 ]; then host_check="$SSH_HOST_SECRET"; else host_check="[$SSH_HOST_SECRET]:$PORT"; fi
          ssh-keygen -F "$host_check" -f ~/.ssh/known_hosts > /dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"

      - name: Náhled, pak volitelný zápis
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          APPLY_ENABLED: ${{ vars.KIS_CLUB_PROGRAM_RECURRENCE_APPLY_ENABLED }}
        run: |
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          SCP=(scp -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          "${SSH[@]}" "set -eu; umask 077; test -s '$REMOTE_DIR/config.php'; test -s '$REMOTE_DIR/bin/refresh-club-program-offers.php'; mkdir -p data/.kis-deploy"
          mode=--dry-run
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            if [ "$APPLY_ENABLED" = true ]; then mode=--apply; fi
          elif [ "$REQUESTED_MODE" = apply ]; then
            mode=--apply
          fi
          if [ "$mode" = --apply ] && [ "$APPLY_ENABLED" != true ]; then echo 'Apply is disabled by production variable.'; exit 78; fi
          cat > /tmp/run-club-program-recurrence.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('CLUB_PROGRAM_RECURRENCE_APPLY_ENABLED=$APPLY_ENABLED');
          \$argv=['refresh-club-program-offers.php','$mode'];
          require '$REMOTE_DIR/bin/refresh-club-program-offers.php';
          EOF
          "${SCP[@]}" /tmp/run-club-program-recurrence.php "$SSH_USER@$SSH_HOST:data/.kis-deploy/run-club-program-recurrence.php"
          "${SSH[@]}" "php data/.kis-deploy/run-club-program-recurrence.php"

      - name: Uklidit dočasný bootstrap
        if: always()
        continue-on-error: true
        run: |
          rm -f /tmp/run-club-program-recurrence.php
          if [ -n "${SSH_HOST:-}" ] && [ -n "${SSH_PORT:-}" ] && [ -n "${SSH_USER:-}" ]; then
            ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST" "rm -f -- data/.kis-deploy/run-club-program-recurrence.php"
          fi
