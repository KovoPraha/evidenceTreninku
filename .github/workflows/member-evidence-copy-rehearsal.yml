name: Nácvik převodu evidence členů na izolované kopii

on:
  workflow_dispatch:
    inputs:
      potvrzeni:
        description: 'Napište NACVIK-KOPIE; živá databáze se nemění'
        required: true
        type: string
      mapping:
        description: 'technical = testovací kódy; approved = schválená soukromá mapa'
        required: true
        type: choice
        default: technical
        options:
          - technical
          - approved

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  BACKUP_DIR: data/.kis-backups

jobs:
  rehearsal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Ověřit cíl a potvrzení
        env:
          POTVRZENI: ${{ inputs.potvrzeni }}
        run: |
          set -euo pipefail
          test "$POTVRZENI" = 'NACVIK-KOPIE'
          test "$APP_HOST" = 'kis.kovopraha.cz'
          test -n "$REMOTE_DIR"

      - name: Stahnout kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Připravit PHP pro izolovanou kopii
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, zip
          coverage: none
          tools: composer:v2

      - name: Nainstalovat závislosti
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pripravit overene SSH spojeni
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for promenna in SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do
            test -n "${!promenna}"
          done
          PORT="${SSH_PORT_SECRET:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          if [ "$PORT" = '22' ]; then HLEDAT="$SSH_HOST_SECRET"; else HLEDAT="[$SSH_HOST_SECRET]:$PORT"; fi
          ssh-keygen -F "$HLEDAT" -f ~/.ssh/known_hosts > /dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"

      - name: Obnovit vybrane generace zaloh do izolovane MariaDB
        env:
          MAPPING_MODE: ${{ inputs.mapping }}
          PRIVATE_MAPPING_JSON: ${{ secrets.KIS_MEMBER_EVIDENCE_MAP }}
        run: |
          set -euo pipefail
          source .github/scripts/production-ssh-retry.sh
          production_ssh_init
          TMP="/tmp/kis-member-rehearsal-$GITHUB_RUN_ID"
          install -d -m 700 "$TMP"
          if [ "$MAPPING_MODE" = approved ]; then
            test -n "$PRIVATE_MAPPING_JSON"
            umask 077
            printf '%s' "$PRIVATE_MAPPING_JSON" > "$TMP/mapping.json"
            export MEMBER_REHEARSAL_MAP_FILE="$TMP/mapping.json"
          else
            test "$MAPPING_MODE" = technical
          fi
          unset PRIVATE_MAPPING_JSON
          COUNT=1
          BACKUP_OUTPUT=$(production_retry_capture "${SSH[@]}" "set -eu; ls -1t '$BACKUP_DIR'/evidence_*.sql.gz 2>/dev/null | head -n '$COUNT'")
          BACKUPS=()
          while IFS= read -r backup; do [ -n "$backup" ] && BACKUPS+=("$backup"); done <<< "$BACKUP_OUTPUT"
          test "${#BACKUPS[@]}" = "$COUNT"

          VERIFIED=0
          for LATEST in "${BACKUPS[@]}"; do
            [[ "$LATEST" =~ ^data/\.kis-backups/evidence_[0-9A-Za-z_-]+\.sql\.gz$ ]]
            BASE="${LATEST%.sql.gz}"
            production_retry "${SCP[@]}" "$SSH_USER@$SSH_HOST:$LATEST" "$TMP/"
            production_retry "${SCP[@]}" "$SSH_USER@$SSH_HOST:$BASE.sha256" "$TMP/"
            production_retry "${SCP[@]}" "$SSH_USER@$SSH_HOST:$BASE.manifest.json" "$TMP/"
            cd "$TMP"
            SQL_FILE=$(basename "$LATEST")
            SHA_FILE="$(basename "$BASE").sha256"
            MANIFEST_FILE="$(basename "$BASE").manifest.json"
            sha256sum -c "$SHA_FILE"
            test "$(jq -r '.sha256' "$MANIFEST_FILE")" = "$(sha256sum "$SQL_FILE" | awk '{print $1}')"
            test "$(jq -r '.application' "$MANIFEST_FILE")" = 'evidence'
            test "$(jq -r '.sql_file' "$MANIFEST_FILE")" = "$SQL_FILE"
            test "$(jq -r '.format_version | numbers' "$MANIFEST_FILE")" -ge 1

            VERIFIED=$((VERIFIED + 1))
            CONTAINER="kis-member-rehearsal-$GITHUB_RUN_ID"
            RESTORE_PASSWORD=$(openssl rand -hex 24)
            docker run -d -p 127.0.0.1:33306:3306 --name "$CONTAINER" -e MARIADB_ROOT_PASSWORD="$RESTORE_PASSWORD" mariadb:11.4 > /dev/null
            READY=0
            for i in $(seq 1 60); do
              if docker exec "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" -Nse 'SELECT 1' > /dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 2
            done
            test "$READY" = '1'
            docker exec "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" -e 'CREATE DATABASE kis_member_rehearsal CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
            gzip -dc "$SQL_FILE" | docker exec -i "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" kis_member_rehearsal

            CHECKED=0
            while IFS=$'\t' read -r TABLE EXPECTED; do
              [[ "$TABLE" =~ ^[a-z0-9_]+$ ]]
              ACTUAL=$(docker exec "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" -Nse "SELECT COUNT(*) FROM \`$TABLE\`" kis_member_rehearsal)
              test "$ACTUAL" = "$EXPECTED"
              CHECKED=$((CHECKED + 1))
            done < <(jq -r '.tables | to_entries[] | [.key,.value] | @tsv' "$MANIFEST_FILE")
            EXPECTED_TRIGGERS=$(jq -r '.triggers | sort | join("\n")' "$MANIFEST_FILE")
            ACTUAL_TRIGGERS=$(docker exec "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" -Nse "SELECT TRIGGER_NAME FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='kis_member_rehearsal' ORDER BY TRIGGER_NAME")
            test "$ACTUAL_TRIGGERS" = "$EXPECTED_TRIGGERS"
            cp "$SQL_FILE" source.sql.gz
            export MEMBER_REHEARSAL_CONFIRM=ISOLATED-COPY-ONLY
            export MEMBER_REHEARSAL_DIRECTORY="$TMP"
            export MEMBER_REHEARSAL_PORT=33306
            export MEMBER_REHEARSAL_PASSWORD="$RESTORE_PASSWORD"
            php "$GITHUB_WORKSPACE/tests/Support/MemberEvidenceProductionCopyRehearsal.php" rehearse
            docker exec "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" -e 'DROP DATABASE kis_member_rehearsal; CREATE DATABASE kis_member_rehearsal CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
            gzip -dc "$SQL_FILE" | docker exec -i "$CONTAINER" mariadb -uroot -p"$RESTORE_PASSWORD" kis_member_rehearsal
            php "$GITHUB_WORKSPACE/tests/Support/MemberEvidenceProductionCopyRehearsal.php" verify-restore
            docker rm -f "$CONTAINER" > /dev/null
            echo "Generace $VERIFIED obnovena: $CHECKED tabulek, $(jq '.triggers | length' "$MANIFEST_FILE") triggeru."
          done
          echo "Izolovana obnova overena pro $VERIFIED generaci zaloh."

      - name: Odstranit izolovanou DB a soukromou kopii
        if: always()
        run: |
          docker rm -f "kis-member-rehearsal-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          rm -rf -- "/tmp/kis-member-rehearsal-$GITHUB_RUN_ID"
