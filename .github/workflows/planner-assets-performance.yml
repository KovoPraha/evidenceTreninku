name: Planner Bootstrap assets parity and performance

on:
  pull_request:
    paths:
      # The release benchmark compares an exact frozen planner source.
      # The ordinary planner regression suite runs for subsequent application edits.
      - 'tests/Support/PlannerAssets*'
      - '.github/workflows/planner-assets-performance.yml'
  workflow_dispatch:
    inputs:
      mariadb_version:
        description: Manual run target (pull requests always verify both versions)
        type: choice
        options: ['both', '10.3', '11.4']
        default: both

permissions:
  contents: read

jobs:
  native-profile:
    name: Planner Bootstrap assets HTTP (MariaDB ${{ matrix.mariadb-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mariadb-version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.mariadb_version == '10.3' && '["10.3"]' || github.event_name == 'workflow_dispatch' && inputs.mariadb_version == '11.4' && '["11.4"]' || '["10.3","11.4"]') }}
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: mbstring, gd, zip, curl, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare real Apache
        run: sudo apt-get update -qq && sudo apt-get install -y apache2
      - name: Prepare Chrome and CLI
        if: matrix.mariadb-version == '11.4'
        run: |
          command -v npx
          npm install --global @playwright/cli@0.1.23
          if ! command -v google-chrome >/dev/null; then npx --yes playwright install --with-deps chrome; fi
          google-chrome --version
      - name: Compare whole authenticated HTTP, duplicate CSS and actual Chrome
        env:
          PLANNER_ASSETS_BASE_SHA: 907459401d45159678f8f54c4035a1e76c0e094b
          PLANNER_ASSETS_BROWSER: ${{ matrix.mariadb-version == '11.4' && '1' || '0' }}
          EVIDENCE_PERFORMANCE_CONFIRM: SYNTHETIC-ONLY
          EVIDENCE_MARIADB_SMOKE_PORT: '3306'
          EVIDENCE_PERFORMANCE_DATADIR: /var/lib/mysql
        run: python3 tests/Support/PlannerAssetsProfile.py
      - name: Preserve safe native HTTP and session evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: planner-assets-${{ matrix.mariadb-version }}
          path: output/planner-assets-safe/
          if-no-files-found: warn
          retention-days: 30
