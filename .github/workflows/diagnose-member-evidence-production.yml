name: Inventura evidence členů před převodem (pouze čtení)

on:
  workflow_dispatch:
    inputs:
      potvrzeni:
        description: 'Pro čtecí inventuru napište OVERIT-CLENSTVI'
        required: true
        type: string
      approved_preview:
        description: 'Po nasazení vytvořit soukromý náhled schválené mapy; žádné zápisy do DB'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  DEPLOY_BASE: data/.kis-deploy

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Ověřit cíl a potvrzení
        env:
          POTVRZENI: ${{ inputs.potvrzeni }}
        run: |
          set -euo pipefail
          test "$POTVRZENI" = 'OVERIT-CLENSTVI'
          test "$APP_HOST" = 'kis.kovopraha.cz'
          [[ "$REMOTE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$REMOTE_DIR" != *..* ]]

      - name: Stáhnout aktuální commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Připravit ověřené SSH spojení
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do test -n "${!name}"; done
          PORT="${SSH_PORT_SECRET:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          if [ "$PORT" = 22 ]; then LOOKUP="$SSH_HOST_SECRET"; else LOOKUP="[$SSH_HOST_SECRET]:$PORT"; fi
          ssh-keygen -F "$LOOKUP" -f ~/.ssh/known_hosts >/dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"

      - name: Přečíst tabulky, vazby a neosobní souhrny členství
        env:
          APPROVED_PREVIEW: ${{ inputs.approved_preview }}
          PRIVATE_MAPPING_JSON: ${{ secrets.KIS_MEMBER_EVIDENCE_MAP }}
        run: |
          set -euo pipefail
          source .github/scripts/production-ssh-retry.sh
          production_ssh_init
          PREVIEW_PATH=''
          if [ "$APPROVED_PREVIEW" = true ]; then
            test -n "$PRIVATE_MAPPING_JSON"
            umask 077
            printf '%s' "$PRIVATE_MAPPING_JSON" > /tmp/kis-member-approved-mapping.json
            PREVIEW_PATH="$DEPLOY_BASE/member-preview-$GITHUB_RUN_ID"
            production_retry "${SSH[@]}" "mkdir -m 700 '$PREVIEW_PATH'"
            production_retry "${SCP[@]}" /tmp/kis-member-approved-mapping.json "$SSH_USER@$SSH_HOST:$PREVIEW_PATH/mapping.json"
            production_retry "${SSH[@]}" "chmod 600 '$PREVIEW_PATH/mapping.json'"
          fi
          unset PRIVATE_MAPPING_JSON
          production_retry "${SCP[@]}" bin/diagnose-member-evidence.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/diagnose-member-evidence.php"
          cat > /tmp/run-member-evidence-diagnostic.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('APP_ROOT=$REMOTE_DIR');
          putenv('MEMBER_EVIDENCE_PREVIEW_DIR=$PREVIEW_PATH');
          require __DIR__ . '/diagnose-member-evidence.php';
          diagnoseMemberEvidenceMain();
          EOF
          production_retry "${SCP[@]}" /tmp/run-member-evidence-diagnostic.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-member-evidence-diagnostic.php"
          "${SSH[@]}" "php '$DEPLOY_BASE/run-member-evidence-diagnostic.php'" | tee /tmp/kis-member-evidence-inventory.json
          jq -e '.read_only == true and (.tables | length > 0) and (.teams | type == "array")' /tmp/kis-member-evidence-inventory.json >/dev/null
          if [ "$APPROVED_PREVIEW" = true ]; then
            jq -e '.approved_preview.opening_count == 435 and .approved_preview.delete_counts.club_roster_members == 560 and (.approved_preview.groups | length) == 8' /tmp/kis-member-evidence-inventory.json >/dev/null
            echo "Soukromý manifest: $PREVIEW_PATH/manifest.json; DB se neměnila, zápisy nebyly pozastaveny."
          fi

      - name: Uklidit dočasné skripty
        if: always()
        continue-on-error: true
        run: |
          rm -f /tmp/kis-member-evidence-inventory.json /tmp/run-member-evidence-diagnostic.php /tmp/kis-member-approved-mapping.json
          if [ -n "${SSH_HOST:-}" ]; then
            source .github/scripts/production-ssh-retry.sh
            production_ssh_init
            production_retry "${SSH[@]}" "rm -f -- '$DEPLOY_BASE/diagnose-member-evidence.php' '$DEPLOY_BASE/run-member-evidence-diagnostic.php'"
          fi
