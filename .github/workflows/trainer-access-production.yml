name: Obnova hesel trenérů

on:
  workflow_dispatch:
    inputs:
      action:
        description: Kontrola, zpracování trenérských žádostí nebo jednorázový schválený test
        type: choice
        default: status
        options: [status, process, probe, install]

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  WORKER_BOOTSTRAP: data/.kis-deploy/run-trainer-access-operations.php

jobs:
  odeslat:
    name: Obnova trenérského přístupu
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Připravit ověřené SSH spojení
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for promenna in APP_HOST REMOTE_DIR SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do if [ -z "${!promenna}" ]; then echo "❌ Chybí povinná konfigurace: $promenna.";exit 1;fi;done
          [[ "$APP_HOST" =~ ^[a-z0-9.-]+$ ]] || { echo '❌ Neplatný hostname.';exit 1; }
          [[ "$REMOTE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo '❌ Neplatná cesta.';exit 1; }
          case "$REMOTE_DIR" in /*|*..*) echo '❌ Neplatná cesta.';exit 1;;esac
          PORT="${SSH_PORT_SECRET:-22}";install -d -m 700 ~/.ssh;printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519;printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts;chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts;ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          if [ "$PORT" = 22 ]; then HLEDAT="$SSH_HOST_SECRET";else HLEDAT="[$SSH_HOST_SECRET]:$PORT";fi;ssh-keygen -F "$HLEDAT" -f ~/.ssh/known_hosts > /dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV";echo "SSH_PORT=$PORT" >> "$GITHUB_ENV";echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"

      - name: Provést vybranou operaci
        env:
          TRAINER_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$TRAINER_ACTION" in status|process|probe|install) ;; *) exit 2;; esac
          SSH=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          SCP=(scp -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          if [ "$TRAINER_ACTION" = status ]; then
            "${SSH[@]}" "test -d 'CRON.1minuta' && test -w 'CRON.1minuta' && echo hosting_minute_directory_available"
          fi
          "${SSH[@]}" "set -eu;umask 077;test -s '$REMOTE_DIR/config.php';test -s '$REMOTE_DIR/bin/trainer-access-operations.php';mkdir -p 'data/.kis-deploy'"
          # Omezený hosting zahazuje shellové prostředí před spuštěním PHP.
          # Bootstrap proto nastaví hodnoty v PHP procesu a spustí worker bez CLI parametrů.
          cat > /tmp/run-trainer-access-operations.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('TRAINER_RESET_ACTION=$TRAINER_ACTION');
          putenv('TRAINER_RESET_OPERATIONS_DIR=' . __DIR__);
          require '$REMOTE_DIR/bin/trainer-access-operations.php';
          EOF
          "${SCP[@]}" /tmp/run-trainer-access-operations.php "$SSH_USER@$SSH_HOST:$WORKER_BOOTSTRAP"
          "${SSH[@]}" "set -eu;chmod 600 '$WORKER_BOOTSTRAP';test -s '$WORKER_BOOTSTRAP';php '$WORKER_BOOTSTRAP'"

      - name: Odstranit dočasný bootstrap
        if: always()
        continue-on-error: true
        run: |
          ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SSH_USER@$SSH_HOST" "rm -f -- '$WORKER_BOOTSTRAP'"
          rm -f /tmp/run-trainer-access-operations.php
