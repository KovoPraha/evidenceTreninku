name: Diagnostika schématu čtení profilu (pouze metadata)

on:
  workflow_dispatch:
    inputs:
      potvrzeni:
        description: 'Pro čtení indexů napište OVERIT-PROFIL-SCHEMA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: produkce-kis
  cancel-in-progress: false

env:
  APP_HOST: ${{ vars.KIS_APP_HOST }}
  REMOTE_DIR: ${{ vars.KIS_REMOTE_DIR }}
  DEPLOY_BASE: data/.kis-deploy

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Ověřit cíl a potvrzení
        env:
          POTVRZENI: ${{ inputs.potvrzeni }}
        run: |
          set -euo pipefail
          test "$POTVRZENI" = 'OVERIT-PROFIL-SCHEMA'
          test "$APP_HOST" = 'kis.kovopraha.cz'
          [[ "$REMOTE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$REMOTE_DIR" != *..* ]] && [[ "$REMOTE_DIR" != /* ]]

      - name: Stáhnout aktuální commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Připravit ověřené SSH spojení
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_USER_SECRET: ${{ secrets.SSH_USER }}
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in SSH_HOST_SECRET SSH_USER_SECRET SSH_KEY_SECRET SSH_KNOWN_HOSTS_SECRET; do test -n "${!name}"; done
          PORT="${SSH_PORT_SECRET:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SECRET" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS_SECRET" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          if [ "$PORT" = 22 ]; then LOOKUP="$SSH_HOST_SECRET"; else LOOKUP="[$SSH_HOST_SECRET]:$PORT"; fi
          ssh-keygen -F "$LOOKUP" -f ~/.ssh/known_hosts >/dev/null
          echo "SSH_HOST=$SSH_HOST_SECRET" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER_SECRET" >> "$GITHUB_ENV"

      - name: Přečíst pouze definice sportovních tabulek
        run: |
          set -euo pipefail
          source .github/scripts/production-ssh-retry.sh
          production_ssh_init
          production_retry "${SCP[@]}" bin/diagnose-athlete-read-schema.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/diagnose-athlete-read-schema.php"
          cat > /tmp/run-athlete-schema.php <<EOF
          <?php
          putenv('APP_HOST=$APP_HOST');
          putenv('APP_ROOT=$REMOTE_DIR');
          putenv('ATHLETE_SCHEMA_SOURCE_SHA=${{ github.sha }}');
          require __DIR__ . '/diagnose-athlete-read-schema.php';
          diagnoseAthleteReadSchemaMain();
          EOF
          production_retry "${SCP[@]}" /tmp/run-athlete-schema.php "$SSH_USER@$SSH_HOST:$DEPLOY_BASE/run-athlete-schema.php"
          "${SSH[@]}" "php '$DEPLOY_BASE/run-athlete-schema.php'" | tee /tmp/kis-athlete-schema.json
          jq -e '.contract == "athlete-read-schema-v1" and .ok == true and .read_only == true and .domain_rows_read == false and .ddl_executed == false and (.tables | length == 5)' /tmp/kis-athlete-schema.json >/dev/null
          EXPECTED_PROBE_SHA=$(sha256sum bin/diagnose-athlete-read-schema.php | cut -d ' ' -f 1)
          jq -e --arg sha "$EXPECTED_PROBE_SHA" '.probe_sha256 == $sha' /tmp/kis-athlete-schema.json >/dev/null

      - name: Uchovat pouze neosobní metadatový protokol
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: athlete-read-schema
          path: /tmp/kis-athlete-schema.json
          if-no-files-found: warn
          retention-days: 30

      - name: Uklidit dočasné skripty
        if: always()
        run: |
          rm -f /tmp/kis-athlete-schema.json /tmp/run-athlete-schema.php
          if [ -n "${SSH_HOST:-}" ]; then
            source .github/scripts/production-ssh-retry.sh
            production_ssh_init
            production_retry "${SSH[@]}" "rm -f -- '$DEPLOY_BASE/diagnose-athlete-read-schema.php' '$DEPLOY_BASE/run-athlete-schema.php'"
          fi
